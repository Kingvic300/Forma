name: Release
# Builds installers on each platform when a version tag (v*) is pushed and attaches them,
# plus the signed updater files and latest.json, to a GitHub release. Installed copies of
# Forma read latest.json and update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage,rpm
          - platform: macos-14       # Apple silicon
            bundles: dmg,app
          - platform: macos-15-intel # Intel
            bundles: dmg,app
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Forma ${{ github.ref_name }}
          releaseBody: |
            Docs, Sheets, Forms, PDF and Tracker in one offline desktop app.

            Download the file for your system:
            - Linux: `.deb` (Debian, Ubuntu, Kali), `.AppImage` (any distribution) or `.rpm`
            - macOS: `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - Windows: `-setup.exe` or `.msi`

            Already have Forma? It updates itself: the new version downloads in the background and you'll be asked to restart.

            These builds are not code-signed yet. See the README's "Installing" section for how to open them on macOS and Windows.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  notes:
    # After every platform has uploaded, turn the flat file list into a per-platform table.
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write download table into the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_notes.py "${{ github.ref_name }}"
