[package]
name = "forma"
version = "0.1.0"
description = "Forma — offline desktop suite: Docs, Sheets, Forms, PDF and Tracker"
authors = ["Forma contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "forma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-fs = "2"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
